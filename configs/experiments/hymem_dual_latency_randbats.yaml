# Real-time check of the dual-process agent: System 1 (Jev) answers confident turns, HyMem
# (Qwen3.5-4B on mlx) plans the rest with a 120 s cap (then the System-1 answer is played), and
# Jev routes HyMem's memory items into the contexts that need them. Same setup as
# hymem_latency_randbats.yaml (one battle vs random, nothing else on the model server).
#   bash scripts/serve_qwen35_mlx.sh > runs/_latency/mlx_server_dual.log 2>&1
#   python -m arena.cli run configs/experiments/hymem_dual_latency_randbats.yaml --emit-events
name: hymem_dual_latency_randbats
format: gen9randombattle
seed: 0
agents:
  - name: hymem_dual
    type: llm_hymem_dual
    model: qwen3.5-4b-mlx
    # max_hard 1.0: the 'hard turn' Noul tracked nothing offline (runs/jev_eval/decisions), so it does not gate
    params: {config_path: configs/hymem/mac.yaml, jev_model: jev-1.13.0, memory_router: jev, slow_budget_s: 120,
             max_hard: 1.0}
  - {name: random, type: random}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 1, anchors: [random]}
