# Mac smoke test: one HyMem battle, local Qwen3.5-4B (mlx_lm) vs Random, gen9randombattle.
#   bash scripts/serve_qwen35_mlx.sh            # terminal 1
#   (cd ../pokemon-showdown && node pokemon-showdown start --no-security)   # terminal 2
#   python -m arena.cli run configs/experiments/hymem_smoke_randbats.yaml --emit-events
name: hymem_smoke_randbats
format: gen9randombattle
seed: 0
agents:
  - {name: hymem, type: llm_hymem, model: qwen3.5-4b-mlx, params: {config_path: configs/hymem/mac.yaml}}
  - {name: random, type: random}
augmentations: {}        # HyMem's executor uses its default tool set
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 1, anchors: [random]}
