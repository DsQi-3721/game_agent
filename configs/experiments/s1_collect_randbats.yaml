# System-1 loop, step "collect": the teacher (Jev) plays and every typed request, decision and
# battle outcome is recorded to runs/s1_collect_randbats/s1exp_<agent>.jsonl (dataset input).
# Once a student champion exists, collect with s1_cascade_randbats.yaml instead (the teacher then
# labels exactly the turns the student is unsure about).
#   python -m arena.cli run configs/experiments/s1_collect_randbats.yaml --emit-events
name: s1_collect_randbats
format: gen9randombattle
seed: 1
agents:
  - {name: jev113c, type: jev_fast, params: {jev_model: jev-1.13.0, record: true}}
  - {name: random, type: random}
  - {name: maxpow, type: max_base_power}
  - {name: heuristic, type: simple_heuristics}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 8, anchors: [random, maxpow, heuristic]}
guardrails: {max_cost_usd: 1.0}
