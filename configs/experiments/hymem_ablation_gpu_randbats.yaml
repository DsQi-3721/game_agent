# GPU server: HyMem ablations on gen9randombattle (paper Table 2 analogue + the typed-isolation ablation).
name: hymem_ablation_gpu_randbats
format: gen9randombattle
seed: 0
agents:
  - {name: hymem, type: llm_hymem, model: qwen3.5-4b-vllm, params: {config_path: configs/hymem/gpu.yaml}}
  - {name: hymem_no_iso, type: llm_hymem, model: qwen3.5-4b-vllm, params: {config_path: configs/hymem/gpu.yaml, ablation: no_iso}}
  - {name: hymem_no_mm, type: llm_hymem, model: qwen3.5-4b-vllm, params: {config_path: configs/hymem/gpu.yaml, ablation: no_mm}}
  - {name: hymem_no_isolation, type: llm_hymem, model: qwen3.5-4b-vllm, params: {config_path: configs/hymem/gpu.yaml, ablation: no_typed_isolation}}
  - {name: heuristic, type: simple_heuristics}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 30, anchors: [heuristic]}
