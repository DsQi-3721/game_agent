# Deep fusion, one real-time battle: System 1 in front of AND inside HyMem.
#   front:  Tier 0 -> System 1 (Jev); confident turns are played (~0.4 s)
#   inside: shared option facts in the planner prompt, step control (answer now vs research),
#           System-One task router and executor (tool calls planned by System One, no executor LLM),
#           typed fold (no generative memory extraction) + System-One memory router, routed
#           memory fed back to System 1 (fast_memory); folds in the background
# Same setup as hymem_dual_latency_randbats.yaml (vs random, Qwen3.5-4B on mlx, 120 s cap).
#   bash scripts/serve_qwen35_mlx.sh > runs/_latency/mlx_server_deep.log 2>&1
#   python -m arena.cli run configs/experiments/hymem_deep_latency_randbats.yaml --emit-events
name: hymem_deep_latency_randbats
format: gen9randombattle
seed: 0
agents:
  - name: hymem_deep
    type: llm_hymem_dual
    model: qwen3.5-4b-mlx
    # typed_light: no LLM call in a fold at all (a single local mlx model would otherwise be shared
    # between the background fold and the next slow decision); on GPU use fold_mode: typed
    params: {config_path: configs/hymem/mac.yaml, fold_mode: typed_light, jev_model: jev-1.13.0, memory_router: jev,
             fast_memory: true, shared_facts: true, step_control: true, s1_router: true, s1_executor: true,
             slow_budget_s: 120, max_hard: 1.0}
  - {name: random, type: random}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 1, anchors: [random]}
