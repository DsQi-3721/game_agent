# Mac smoke test of the paper's long-context baselines (same model, tools and views as HyMem):
# flat ReAct over the whole battle and recursive summarization, one battle each vs Random.
# Compare with hymem_smoke_randbats via: python scripts/analyze_context.py runs/longctx_smoke runs/hymem_smoke_randbats
name: longctx_smoke
format: gen9randombattle
seed: 0
agents:
  - {name: flat_react, type: llm_flat_react, model: qwen3.5-4b-mlx, params: {max_steps: 3}}
  - {name: summary, type: llm_summary, model: qwen3.5-4b-mlx, params: {max_steps: 3, summary_threshold: 6000}}
  - {name: random, type: random}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 1, anchors: [random]}
