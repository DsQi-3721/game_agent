# Minimal Metamon end-to-end validation: 1 gen9ou battle vs internal max_base_power.
# Prereqs: bash external/metamon/setup.sh; Showdown server running. No LLM cost (RL net).
name: metamon_e2e
format: gen9ou
seed: 0
agents:
  - {name: maxpow, type: max_base_power}
  - name: metamon
    type: metamon
    kind: external
    external:
      launch_cmd: ["bash", "run.sh"]
      cwd: external/metamon
      username: MetamonOU1
      env: {METAMON_CHECKPOINT: "SmallRLGen9Beta"}
      ready_regex: "accepting challenges|logged in|Waiting|challenge"
      ready_timeout_s: 240
teams: {mode: mirror}
evaluation:
  mode: round_robin
  n_battles: 1
