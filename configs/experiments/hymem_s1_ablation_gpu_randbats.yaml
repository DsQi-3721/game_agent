# GPU server: does System 1 help HyMem? Same backbone (Qwen3.5-4B on vLLM), same budget.
#   hymem          the paper agent (no System 1)
#   hymem_dual     + System-1 fast path in front (Jev teacher) + Jev memory router
#   hymem_deep     + System 1 inside HyMem: shared facts, step control, S1 router / executor, typed fold,
#                    routed memory fed back to System 1
#   hymem_deep_st  hymem_deep with a local student in front of the teacher (cascade; serve it first:
#                    python scripts/s1_serve.py --backend hf --model <base> --adapter <champion> --port 8090)
# Metrics: win rate vs heuristic AND per-decision latency (traj extra: route, latency_s, s1_*).
#   bash scripts/serve_qwen35_vllm.sh /path/to/Qwen3.5-4B          # port 8001 = registry entry qwen3.5-4b-vllm
#   python -m arena.cli run configs/experiments/hymem_s1_ablation_gpu_randbats.yaml --emit-events
name: hymem_s1_ablation_gpu_randbats
format: gen9randombattle
seed: 0
agents:
  - {name: hymem, type: llm_hymem, model: qwen3.5-4b-vllm, params: {config_path: configs/hymem/gpu.yaml}}
  - name: hymem_dual
    type: llm_hymem_dual
    model: qwen3.5-4b-vllm
    params: {config_path: configs/hymem/gpu.yaml, memory_router: jev, slow_budget_s: 60, max_hard: 1.0}
  - name: hymem_deep
    type: llm_hymem_dual
    model: qwen3.5-4b-vllm
    params: {config_path: configs/hymem/gpu.yaml, fold_mode: typed, memory_router: jev, fast_memory: true,
             shared_facts: true, step_control: true, s1_router: true, s1_executor: true, slow_budget_s: 60,
             max_hard: 1.0}
  - name: hymem_deep_st
    type: llm_hymem_dual
    model: qwen3.5-4b-vllm
    params: {config_path: configs/hymem/gpu.yaml, fold_mode: typed, memory_router: jev, fast_memory: true,
             shared_facts: true, step_control: true, s1_router: true, s1_executor: true, slow_budget_s: 60,
             max_hard: 1.0, student_url: "http://127.0.0.1:8090", student_model: champion, s1_timeout_s: 10.0}
  - {name: heuristic, type: simple_heuristics}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 30, anchors: [heuristic]}
guardrails: {max_cost_usd: 5.0}
