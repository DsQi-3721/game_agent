# Official PokeLLMon (external bridge, full mode) e2e: 1 gen9randombattle vs an
# internal agent. Validates the real PokeLLMon code runs (knowledge + sc + history).
# Prereqs: bash external/pokellmon/setup.sh; Showdown server; DeepSeek key in .env.
name: pokellmon_bridge_e2e
format: gen9randombattle
seed: 0
agents:
  - {name: heuristic, type: simple_heuristics}
  - name: pokellmon_official
    type: pokellmon
    kind: external
    external:
      launch_cmd: ["bash", "run.sh"]
      cwd: external/pokellmon
      username: PokeLLMonOff1
      ready_regex: "accepting challenges"
      ready_timeout_s: 120
      stall_timeout_s: 1200
teams: {mode: mirror}
evaluation:
  mode: round_robin
  n_battles: 1
