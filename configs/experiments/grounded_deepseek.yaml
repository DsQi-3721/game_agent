# LLM methods (DeepSeek) with grounding, anchored vs baselines. Costs API tokens.
# Dry-run first:  arena run configs/experiments/grounded_deepseek.yaml --dry-run
name: grounded_deepseek
format: gen9randombattle
seed: 0
full_info: false
agents:
  - {name: random, type: random}
  - {name: maxpow, type: max_base_power}
  - {name: io, type: llm_io, model: deepseek-chat}
  - {name: cot, type: llm_cot, model: deepseek-chat}
  - {name: react, type: llm_react, model: deepseek-chat, params: {max_steps: 3}}
augmentations:
  damage_calc: passive
  type_matchup: passive
  base_stats: passive
  pokedex: tool
teams: {mode: mirror}
evaluation:
  mode: anchored
  n_battles: 3
  anchors: [maxpow, random]
guardrails:
  max_cost_usd: 1.0
