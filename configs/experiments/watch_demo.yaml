# Tiny config for watching a battle live during evaluation.
# Run:  python -m arena.cli run configs/experiments/watch_demo.yaml --watch --turn-delay 1.0
name: watch_demo
format: gen9randombattle
seed: 0
agents:
  - {name: heuristic, type: simple_heuristics}
  - {name: maxpow, type: max_base_power}
teams: {mode: mirror}
evaluation: {mode: round_robin, n_battles: 1}
