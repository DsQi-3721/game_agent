# Validation harness for the external-opponent bridge: an internal max_base_power
# agent vs a stub external bot (poke-env MaxBasePower in its own process).
# Exercises launcher + challenge handshake + A/B orientation + grey-box capture.
# Needs the local Showdown server running. No LLM key / uv / heavy repos.
name: external_stub
format: gen9randombattle
seed: 0
agents:
  - {name: heuristic, type: simple_heuristics}
  - name: stub
    type: stub
    kind: external
    external:
      launch_cmd: ["bash", "run.sh"]
      cwd: external/_stub
      username: ArenaStubBot
      ready_regex: "accepting challenges"
      ready_timeout_s: 60
teams: {mode: mirror}
evaluation:
  mode: round_robin
  n_battles: 2
