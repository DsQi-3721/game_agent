# Minimal PokeChamp end-to-end validation: 1 gen9ou battle (PokeChamp's faithful
# format) vs an internal max_base_power agent. Spends a little DeepSeek.
name: pokechamp_e2e
format: gen9ou
seed: 0
agents:
  - {name: maxpow, type: max_base_power}
  - name: pokechamp
    type: pokechamp
    kind: external
    external:
      launch_cmd: ["bash", "run.sh"]
      cwd: external/pokechamp
      username: PokeChampOU1
      ready_regex: "accepting challenges"
      ready_timeout_s: 90
      stall_timeout_s: 2400
teams: {mode: mirror}
evaluation:
  mode: round_robin
  n_battles: 1
