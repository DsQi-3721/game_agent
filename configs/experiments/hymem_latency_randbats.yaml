# Real-time (latency) measurement of HyMem: ONE battle, nothing else on the model server.
# The opponent is only a fast driver that keeps the battle going (no win-rate claim).
#   bash scripts/serve_qwen35_mlx.sh > runs/_latency/mlx_server.log 2>&1   # keep the log (prefill timestamps)
#   python -m arena.cli run configs/experiments/hymem_latency_randbats.yaml --emit-events
#   python scripts/analyze_latency.py runs/hymem_latency_randbats --server-log runs/_latency/mlx_server.log
name: hymem_latency_randbats
format: gen9randombattle
seed: 0
agents:
  - {name: hymem, type: llm_hymem, model: qwen3.5-4b-mlx, params: {config_path: configs/hymem/mac.yaml}}
  - {name: random, type: random}
augmentations: {}
teams: {mode: mirror}
evaluation: {mode: anchored, n_battles: 1, anchors: [random]}
