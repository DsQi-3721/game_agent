[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microrts-eve-rlcd"
version = "0.2.0"
description = "Fast EVE-RLCD decision model training and inference for MicroRTS"
requires-python = ">=3.11"
dependencies = [
  "JPype1>=1.5",
  "gymnasium>=1.0",
  "numpy>=1.26",
  "torch>=2.5",
  "transformers>=5.0,<6",
  "peft>=0.18",
  "safetensors>=0.5",
  "huggingface-hub>=1.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["microrts_agent*", "rlcd*"]
