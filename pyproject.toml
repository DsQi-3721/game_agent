[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arena"
version = "0.1.0"
description = "Pluggable adversarial-game agent evaluation platform on Pokemon Showdown"
requires-python = ">=3.10"
dependencies = [
    "poke-env>=0.15.0",
    "litellm>=1.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "textual>=0.80",
    "plotext>=5.2",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
viz = ["plotly>=5.20", "wandb>=0.16"]
# System-1 layer: TypeSafe / local System-One client + the local student server
s1 = ["httpx>=0.27", "aiohttp>=3.9"]
# local students on Apple silicon (training + serving with mlx)
s1-mlx = ["mlx-lm>=0.31"]
# local students on GPU servers (training + serving with torch / peft)
s1-gpu = ["torch>=2.4", "transformers>=5.0", "peft>=0.15", "accelerate>=1.0"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
